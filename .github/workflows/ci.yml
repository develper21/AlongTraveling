# ============================================================
# HopAlong — CI Pipeline
# ------------------------------------------------------------
# Base-level pipeline:
#   1. backend  : install → lint → test (Jest + mongodb-memory-server)
#   2. frontend : install → lint → build (Vite)
#   3. e2e      : full-stack Cypress run (Mongo service + backend + frontend)
# ============================================================

name: CI - Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------
  # 1) Backend — install, lint, unit/integration tests
  # ----------------------------------------------------------
  backend:
    name: Backend — Install · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-change-me
      MONGODB_URI: mongodb://localhost:27017/hopalong-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (Jest)
        run: npm test

  # ----------------------------------------------------------
  # 2) Frontend — install, lint, production build
  # ----------------------------------------------------------
  frontend:
    name: Frontend — Install · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Vite)
        run: npm run build

  # ----------------------------------------------------------
  # 3) E2E — Cypress against the real full stack
  #    (Mongo service → seed → backend :5000 → frontend :3000)
  # ----------------------------------------------------------
  e2e:
    name: E2E — Cypress (Full Stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYPRESS_apiUrl: http://localhost:5000/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Seed demo data
        working-directory: backend
        run: npm run seed
        env:
          NODE_ENV: development
          MONGODB_URI: mongodb://localhost:27017/hopalong
          JWT_SECRET: ci-test-jwt-secret-change-me

      - name: Start backend server
        working-directory: backend
        run: |
          nohup node server.js > backend.log 2>&1 &
          echo "Backend starting on port 5000"
        env:
          PORT: 5000
          NODE_ENV: development
          MONGODB_URI: mongodb://localhost:27017/hopalong
          JWT_SECRET: ci-test-jwt-secret-change-me
          FRONTEND_URL: http://localhost:3000
          # Raise the rate limit so the e2e suite doesn't hit 429s
          RATE_LIMIT_MAX: 1000

      - name: Wait for backend to be ready
        run: npx --yes wait-on http://localhost:5000/health --timeout 60000

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npx vite --port 3000 --strictPort --no-open > frontend.log 2>&1 &
          echo "Frontend dev server starting on port 3000"
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
          VITE_SOCKET_URL: http://localhost:5000

      - name: Wait for frontend to be ready
        run: npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Run Cypress tests
        working-directory: frontend
        run: npx cypress run

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          if-no-files-found: ignore

      - name: Upload frontend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: frontend/frontend.log
          if-no-files-found: ignore
